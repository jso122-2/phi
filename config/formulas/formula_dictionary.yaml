# Formula Dictionary — canonical source of truth
# Path: config/formulas/formula_dictionary.yaml
# Updated: 2026-08-20
#
# Schema
#   value_systems  — constants, domains, basins, hubs, gates, guards
#   formulas       — every named formula (id / expr / variables / output / layer)
#
# Each formula entry:
#   id            — unique identifier (matches code F_* / f_* names)
#   label         — human-readable name
#   expr          — canonical mathematical expression
#   variables     — symbol → system field  (some older entries use `vars`)
#   output        — what the formula produces
#   layer         — CAIRRN layer (1=modulation, 2=sharding, 3=coherence, X=composite, Z=z-space)
#   value_system  — which value_systems.* block owns the constants
#   source        — origin (desktop image, vault node, or Python module)
#
# Two hub geometries exist and MUST NOT be mixed:
#   station_hubs  — MCP / Obsidian vault ring (HOME→shard 0, MATH→1-2, …)
#   phi_hubs      — phi CAIRRN ring (agent-context→0, CODE→1, HOME→2, MATH→3, COMMANDS→7)

schema_version: "1.1.0"
updated: 2026-08-20
total_formulas_note: "count is the length of the formulas list; regenerate FORMULAS.md from this file"

value_systems:

  physics:
    description: >
      Shared physical constants. α and κ are the two numbers every other
      system is built from. α is the 95% Gaussian z-score manufactured as a
      double-well attractor; κ is the harmonic-ring coupling (stable iff κ < 0.5).
    constants:
      alpha:
        symbol: α
        value: 1.96
        type: float
        meaning: attractor / well location; 95% Gaussian z-score
        code: [sims.attractors.ALPHA, phi.engine.cairrn._constants.ALPHA]
      kappa:
        symbol: κ
        value: 0.15
        type: float
        domain: (0, 0.5)
        meaning: harmonic coupling constant (mycelial conductance gain)
        code: [sims.harmonic.LocalPropagator.coupling, phi.engine.cairrn._constants.KAPPA, workers.cairrn.mycelial._KAPPA]
      n_shards:
        symbol: N
        value: 8
        type: int
        meaning: shards in the harmonic ring (indices 0–7)
        code: [phi.engine.cairrn._constants.N_SHARDS]
      math_e:
        symbol: e
        value: 2.718281828459045
        type: float
        meaning: Euler's number — used as a constant in F_FORECAST_SCORE
      lambert_w_of_1:
        symbol: W(1)
        value: 0.5671432904097838
        type: float
        meaning: principal Lambert W at 1
      neg_exp_fixed_point:
        symbol: x*
        value: -0.5671432904097838
        type: float
        expr: "x* = -W(1)"
        meaning: stable fixed point of f(x) = −eˣ; |f′(x*)| = W(1) < 1
        code: [sims.attractors.NEG_EXP_FIXED_POINT]
      coherence_floor:
        value: 0.50
        type: float
        meaning: soft floor — reroute fires below this
        code: [phi.engine.cairrn._constants.COHERENCE_FLOOR]
      euler_floor:
        value: 0.5671432904097838
        type: float
        meaning: hard Euler floor |x*| — hub below this is critical degradation
        code: [phi.engine.cairrn._constants.EULER_FLOOR]
      shard_norm:
        value: 14.44
        type: float
        meaning: "normalisation for neg_exp shard map: shard = floor(e^χ · N / SHARD_NORM) clamped to [0, N−1]"
        code: [phi.engine.cairrn._constants.SHARD_NORM]
    numeric_guards:
      div_zero_floor: 1.0e-9
      pericles_x_floor: 1.0e-12
      z_floor: 0.01
      meaning: clamp denominators / |z| away from zero before division

  double_well:
    description: Symmetric double-well that manufactures ±α as stable states.
    formulas_owned: [F_DOUBLE_WELL, F_GRADIENT_DESCENT, F_LANGEVIN, F_KRAMERS, F_MFPT]
    potential:
      expr: "V(x) = (x² − α²)²"
      gradient: "V′(x) = 4x(x² − α²)"
      hessian: "V″(x) = 4(3x² − α²)"
    fixed_points:
      - {x: 0.0, stability: unstable_saddle, V_second: "−4α²"}
      - {x: 1.96, stability: stable, V_second: "8α² > 0"}
      - {x: -1.96, stability: stable, V_second: "8α² > 0"}
    defaults:
      lr: 0.05
      max_step: 0.5
      max_iter: 2000
      tol: 1.0e-6
    langevin:
      expr: "x_{n+1} = x_n − lr · V′(x_n) + √(2·D·lr) · ξ    ξ ~ N(0,1)"
      D: "noise_scale²"
    kramers:
      expr: "λ = (ω₀ · ω_s) / 2π · exp(−ΔV / D)"
      delta_V: {expr: "α⁴", value: 14.7579}
      omega_0: {expr: "2√2 · α", value: 5.5436}
      omega_s: {expr: "2α", value: 3.92}
      gamma: 1.0
      tau: "1/λ"
      tau_steps: "τ / lr"

  harmonic_ring:
    description: >
      Ring of N shards. Shard i is centred on the (i+1)-th harmonic of α.
      Local diffusion is stable iff 0 < κ < 0.5. Resonance coupling may go
      up to κ < 1.0 because it conserves total activation.
    formulas_owned: [F_HARMONIC_PROPAGATE, F_RESONANCE_PROPAGATE]
    basin_centres:
      - {shard: 0, harmonic: 1, centre: 1.96}
      - {shard: 1, harmonic: 2, centre: 3.92}
      - {shard: 2, harmonic: 3, centre: 5.88}
      - {shard: 3, harmonic: 4, centre: 7.84}
      - {shard: 4, harmonic: 5, centre: 9.80}
      - {shard: 5, harmonic: 6, centre: 11.76}
      - {shard: 6, harmonic: 7, centre: 13.72}
      - {shard: 7, harmonic: 8, centre: 15.68}
    local_propagate:
      expr: "a_i(t+1) = a_i(t) + κ · [a_{i−1}(t) + a_{i+1}(t) − 2·a_i(t)]"
      kappa_default: 0.15
      kappa_domain: (0, 0.5)
    resonance_propagate:
      gate: "gate = −cos(π · a_p / A)"
      spatial: "s_i = −cos(π · d_i)   d_i = min(|i−p|, N−|i−p|) / (N/2)"
      weight: "w_i = exp(gate · s_i)"
      kappa_default: 0.15
      kappa_domain: (0, 1.0)
      conserved: true

  station_hubs:
    description: >
      MCP / Obsidian vault hub geometry. Used by /hub-inject, /hub-state,
      and graph_commit index injection. Independent of phi_hubs.
    mapping:
      HOME:          {shards: [0],    basins: [1.96]}
      MATH:          {shards: [1, 2], basins: [3.92, 5.88]}
      CODE:          {shards: [3, 4], basins: [7.84, 9.80]}
      COMMANDS:      {shards: [5],    basins: [11.76]}
      agent-context: {shards: [6, 7], basins: [13.72, 15.68]}
    code: sims.harmonic.HUB_SHARD_MAP

  phi_hubs:
    description: >
      phi CAIRRN hub geometry. Shard = floor(e^χ · N / SHARD_NORM) clamped
      to [0, N−1]. Waveguide shards 4–6 carry diffused activation only.
      Do not confuse with station_hubs.
    formulas_owned: [F_NEG_EXP]
    mapping:
      agent-context:
        chi: 0.0300
        gravity: 0.50
        rattling: false
        decay: 0.90
        tau: 9.5
        shard: 0
        basin: boundary
      CODE:
        chi: 0.9900
        gravity: 1.50
        rattling: true
        decay: 0.93
        tau: 13.8
        shard: 1
        basin: mirror
      HOME:
        chi: 1.5414
        gravity: 3.00
        rattling: false
        decay: 0.98
        tau: 49.5
        shard: 2
        basin: true_center
      MATH:
        chi: 1.9600
        gravity: 2.00
        rattling: true
        decay: 0.95
        tau: 19.5
        shard: 3
        basin: white_peak
      COMMANDS:
        chi: 2.6700
        gravity: 1.00
        rattling: true
        decay: 0.90
        tau: 9.5
        shard: 7
        basin: escape
    tau_expr: "τ = −1 / log(decay)"
    priority_tiers:
      0: {label: DEFER,  shards: [0]}
      1: {label: NORMAL, shards: [1, 2, 3]}
      2: {label: HIGH,   shards: [4, 5, 6]}
      3: {label: URGENT, shards: [7]}
    code: phi.engine.cairrn._constants.HUB_PARAMS

  ana_chi:
    description: >
      Jackson's Pocket primitives. 𝒜_χ = 1.5414 is the chameleon constant
      (true_center). Five basins on χ ∈ [0.03, 2.67]. Three rattling pockets.
    chameleon_constant:
      symbol: 𝒜_χ
      value: 1.5414
      code: sims.ana_chi.ANA_CHI_CONSTANT
    sigma: 0.40
    rattle_decay: 0.50
    rattle_chi: [0.9900, 1.9600, 2.6700]
    basins:
      - {name: boundary,    chi: 0.0300, gravity: 0.50, rattling: false, colour: blue,   memory_decay: 0.90, hub: agent-context}
      - {name: mirror,      chi: 0.9900, gravity: 1.50, rattling: true,  colour: purple, memory_decay: 0.93, hub: CODE}
      - {name: true_center, chi: 1.5414, gravity: 3.00, rattling: false, colour: white,  memory_decay: 0.98, hub: HOME}
      - {name: white_peak,  chi: 1.9600, gravity: 2.00, rattling: true,  colour: red,    memory_decay: 0.95, hub: MATH}
      - {name: escape,      chi: 2.6700, gravity: 1.00, rattling: true,  colour: orange, memory_decay: 0.90, hub: COMMANDS}
    cosine_drape: "D(r,s,χ) = [cos(r·s·χ) − cos(r·s·χ + 0.01)] × 100"
    rattling_proximity: "P(χ) = exp(−|χ − χ_rattle| / 0.5)"
    temporal_decay: "rate(g) = 0.90 + clamp(g/5, 0, 1) × 0.08"
    multi_basin_potential: "V(χ) = −Σ_i  gravity_i · exp(−(χ − χ_i)² / 2σ²)"

  cairrn_layers:
    description: Pipeline layers that tag every formula.entry.layer
    layers:
      1: {name: modulation,           meaning: Ana-Chi energy / height / friction}
      2: {name: sharding,             meaning: neg_exp map onto the harmonic ring}
      3: {name: coherence,            meaning: SHI / delta / consensus enforcement}
      X: {name: composite_constraint, meaning: cross-layer scores and gates}
      Z: {name: z_space,              meaning: SCOP spatial scoring (−Z)}

  e5_gate:
    description: Ohm's-law emission gate. e5 gates the system; e4 gates the track.
    formulas_owned: [F_E5, F_E4, F_K_SIGIL, F_CC, F_E5_LOAD_LINE]
    open_threshold: 0.1
    marginal_threshold: -0.1
    bc_max: 20
    decisions:
      OPEN:     "e5 >  0.1"
      MARGINAL: "e5 > -0.1"
      BLOCKED:  "e5 < -0.1"
    load_line: "V/R_min = arctanh(0.1) + Bc / 20  ≈  0.1003 + Bc/20"
    e5_expr: "e5 = tanh( (H + K) / (G − energy_dot) − Bc / bc_max )"
    e4_expr: "e4 = |e5 / (−z)| + Cc − 1     (emits when e4 > 0)"
    k_sigil_expr: "k = (H + Cc) − G"
    cc_expr: "Cc = ((c − A) / p) · Tcv"
    code: workers.cairrn.formulas

  d_friction_gate:
    description: Suppresses should_act when local friction delta is too high.
    expr: "D = |fl − (Ti · |x/Z| + βt)|"
    local_friction: 0.5
    d_gate_threshold: 1.0
    z_floor: 0.01
    rule: "D > D_GATE_THRESHOLD → gate suppresses action"
    code: phi.engine.cairrn._constants

  mycelial:
    description: Living metabolic substrate on the CAIRRN node graph.
    formulas_owned: [F_HEBBIAN_LEARNING, F_CONNECTION_DECAY, F_SPORE_ENERGY_DECAY, F_ADAPTIVE_CAPACITY, F_MYCELIAL_DEMAND, F_NUTRIENT_ALLOC, F_METABOLISE, F_CONDUCTANCE]
    constants:
      kappa:           {symbol: κ,         value: 0.15, meaning: sigmoid gain in conductance}
      theta_grow:      {symbol: θ_grow,    value: 0.30, meaning: min energy to open Growth Gate}
      theta_sim:       {symbol: θ_sim,     value: 0.25, meaning: min semantic similarity for a new edge}
      theta_prune:     {symbol: θ_prune,   value: 0.10, meaning: starvation floor → autophagy}
      tau_ticks:       {symbol: τ_ticks,   value: 3,    meaning: consecutive starved ticks before autophagy}
      eta:             {symbol: η,         value: 0.80, meaning: nutrients → energy conversion rate}
      e_max:           {symbol: E_max,     value: 1.00, meaning: energy ceiling per node}
      basal_cost:      {value: 0.02, meaning: metabolic cost subtracted every tick}
      gamma:           {symbol: γ,         value: 0.50, meaning: active transport gain}
      alpha_hebbian:   {symbol: α_hebb,    value: 0.10, meaning: Hebbian learning rate (NOT physics α)}
      beta_decay:      {symbol: β,         value: 0.05, meaning: temporal decay weight on w_ij}
      chi_w:           {symbol: χ_w,       value: 0.03, meaning: entropy suppression weight on w_ij}
      absorption_rate: {value: 0.20}
      fusion_bonus:    {value: 0.15}
      fission_rate:    {value: 0.25}
    demand_weights:
      w_pressure: 0.40
      w_drift: 0.25
      w_recency: 0.20
      w_entropy: 0.15
    demand_expr: "D_i = wP·P_i + wΔ·drift_align_i + wR·recency_i − wσ·σ_i"
    code: workers.cairrn.mycelial

  dawn_confidence:
    description: >
      DAWN confidence x. Nested variable used as the imaginary / superposition
      state of DAWN — a cloud of possibility, not a pinpointed measured
      confidence. Feeds Pericles as the denominator, and the r1–r6 nested
      stack as x_i.
    formulas_owned: [F_DAWN_CONFIDENCE, F_JULES_NORM]
    expr: "x = |k · j'| ∨ D"
    vee: "∨ = max / logical-OR over magnitudes"
    k:
      symbol: K
      meaning: dawn neuro activation
      type: float
    j_prime:
      symbol: j'
      meaning: normalised Jules
      pipeline:
        - "take raw Jules J to millijoule precision (0.001)"
        - "normalise; take the 0.00 baseline out (min-shift so focused floor is exactly 0.00)"
      expr: "j' = J_q − min(J_q)     J_q = round(J, 3)"
      millijoule: 0.001
      zero_baseline: 0.00
    D:
      symbol: D
      meaning: delta vector of variable drift
      type: vector
      hotswappable: true
      note: >
        Drift implementation is hot-swappable. Current /find default is the
        positive half-sine iwave D = sin(π · β / 2), but any drift vector
        (semantic, embedding, mycelial Δ) may be substituted without changing x.
    code: psspps.find._pericles
    source: keep/2026-03-24-234438 (x is a formula for DAWN confidence)

  pericles:
    description: Exact-retrieval re-score used by /find. No room for error.
    formulas_owned: [F_PERICLES]
    expr: "per = |tc_A − Adp_At| · k / x"
    x: F_DAWN_CONFIDENCE
    x_expr: "x = |k · j'| ∨ D     (DAWN confidence)"
    pipeline:
      - top-5 by combined semantic+harmonic score
      - Pericles re-score
      - top-3 to operator
      - 1 final answer
    combined_score_alpha: 0.5
    code: psspps.find._pericles

  psspps:
    description: Pre-route → retrieve → semantic+harmonic perspective → post-route.
    perspective_alpha:
      default: 0.5
      domain: [0.0, 1.0]
      meaning: "0.0 = pure TF-IDF semantic; 1.0 = pure harmonic perspective"
    top_k_default: 3

  variable_domains:
    description: Recurring domains for symbols that appear across many formulas.
    unit_interval:  {domain: "[0, 1]", examples: [likelihood, possibility, confidence, tracer_consensus, sigma, recency]}
    boolean_temporal: {domain: "{0, 1}", examples: [x in F_SCOPE_NAV]}
    shard_index:    {domain: "[0, 7]", type: int}
    pressure:       {domain: "≥ 0", examples: [p, beta_t, cognitive_pressure]}
    energy:         {domain: "typically [0, 1] or unbounded ≥ 0", note: "routing energy ≠ mycelial metabolic energy"}
    shi:            {domain: "> 0", meaning: Schema Health Index}
    activation:     {domain: "ℝ, typically ≥ 0"}

formulas:
  # ────────────────────────────────────────────────────────────────────────────
  # DESKTOP FORMULAS  (new, from envelope photos)
  # ────────────────────────────────────────────────────────────────────────────

  - id: F_CONSTRAINT_VAR
    label: Constraint Variable
    expr: "x_c = Lh / P - O"
    variables:
      Lh: likelihood          # float [0,1]
      P:  possibility         # float [0,1]
      O:  opportunity_cost    # float
    output: x_c               # constraint variable fed into F_FORECAST_SCORE
    layer: X
    source: "1765368575652.jpg"

  - id: F_FORECAST_SCORE
    label: Forecast Score
    expr: "score = |(D - e) / x_c| * T * delta_j"
    variables:
      D:       forecasting_result   # float, percentage [0,1]
      e:       math_e               # constant 2.71828...
      x_c:     constraint_variable  # output of F_CONSTRAINT_VAR
      T:       temporal_validator   # float
      delta_j: energy_available     # float, Δj energy delta
    output: score
    layer: X
    source: "1765368575652.jpg"

  - id: F_SCOPE_NAV
    label: Scope Navigation Score
    expr: "z = ||A + J| - beta| * x / sqrt(D)"
    variables:
      A:    current_node            # float, semantic position
      J:    current_objective       # float
      beta: energy_to_move          # float, energy required to reach desired node
      x:    boolean_temporal        # int {0, 1}
      D:    SHI                     # Semantic Hash Index (float > 0)
    output: z                       # scope coordinate
    layer: 2
    source: "1765368575713.jpg"

  - id: F_LOCATION_ROUTE
    label: Location Routing Score
    expr: "R_loc = |x / F| * |T * sum(D_w[i], i=1..n)|"
    variables:
      x:   location          # float, spatial coordinate
      F:   energy_projected  # float
      T:   ticks_to_move     # int
      D_w: distance_per_waypoint  # list[float], one entry per waypoint
    output: R_loc
    layer: 2
    source: "1765509979533.jpg"

  - id: F_ENERGY_WEIGHTED
    label: Weighted Energy Sum
    expr: "EW = sum( |x_i - z_i| / A * T_Dw_i, i=1..n ) * n_w"
    variables:
      x_i:   energy_i             # float per node
      z_i:   desirability_cost_i  # float per node
      A:     resources            # float
      T_Dw:  distance_weighted_time   # list[float], one per node
      n_w:   positive_normalisation   # float > 0
    output: EW
    layer: 1
    source: "1765509991901.jpg"

  - id: F_CAIRRN_COMPOSITE
    label: CAIRRN Composite Score
    expr: "Psi = |z + x| * |1 - c| - |z + x| * |y - c| + Ti"
    variables:
      z:  confidence      # float [0,1]  (SCOP confidence)
      x:  scope           # float        (SCUP coordinate)
      y:  dawn_data       # float        (DAWN state value)
      c:  energy_cost     # float        (metabolic cost)
      Ti: tick_interval   # int          (current tick #)
    output: Psi           # CAIRRN composite score
    layer: X
    source: "1765537045100.jpg"

  - id: F_DELTA_TWO
    label: Second-Order Delta
    expr: "delta2 = |D_n + T| / |d_p| * O / T"
    variables:
      D_n: semantic_distance    # float, D_n
      T:   time_steps           # int/float
      d_p: pressure_gradient    # float, ∂p
      O:   opportunity_cost     # float
    output: delta2              # δ₂, second-order pressure/distance delta
    layer: 3
    source: "1765537045100.jpg"

  - id: F_ENERGY_CONSUMPTION
    label: Energy Consumption Score
    expr: "Ec = (|C - A| * T / p) * Tcv"
    variables:
      C:   required_energy           # float, cognitive energy required
      A:   current_position          # float, total current position value
      T:   temporal_validator        # float, time factor
      p:   performance               # float [0,1]
      Tcv: tracer_consensus_value    # float
    output: Ec
    layer: 1
    source: "1765602667244.jpg"

  - id: F_TRACER_CONSENSUS_K
    label: Tracer Consensus Delta
    expr: "K = |Tcv| - D"
    variables:
      Tcv: tracer_consensus_value  # float
      D:   SHI                     # Semantic Hash Index
    output: K                      # tracer consensus delta / weight factor for Tws
    layer: 3
    source: "1765602667244.jpg"

  - id: F_HEIGHT_NODE
    label: Height Node Component
    expr: "H = |g + A| - Tcv"
    variables:
      g:   global_friction         # float, system-wide resistance
      A:   current_mode            # float, current SCUP/mode coordinate
      Tcv: tracer_consensus_value  # float
    output: H                      # height component
    layer: 1
    source: "1765602671643.jpg"

  - id: F_GLOBAL_RZONE
    label: Global R-Zone Component
    expr: "G = |r^2| / d_beta * Tcv - beta"
    variables:
      r:      rzone_coordinate      # float, R-zone spatial position
      d_beta: pressure_gradient     # float, ∂β (pressure derivative)
      Tcv:    tracer_consensus_value # float
      beta:   SHI                   # Semantic Hash Index (δ₁)
    output: G                       # global R-zone component
    layer: 1
    source: "1765602671643.jpg"

  - id: F_TICK_WISDOM
    label: Tick Wisdom Score
    expr: "Tws = Tn / K   where Tn >= Tip"
    variables:
      Tn:  tracer_at_n    # float, tracer value at tick n
      Tip: tip_value      # float, minimum tip threshold
      K:   tracer_consensus_delta  # float, output of F_TRACER_CONSENSUS_K
    output: Tws           # tracer wisdom score (tick interval present)
    layer: 3
    source: "1765602681971.jpg"

  - id: F_LOCAL_FRICTION_D
    label: Local Friction Delta Score
    expr: "fl = |delta_z - Tks| * (x / z) + beta"
    variables:
      delta_z: local_friction       # float, δz local friction component
      Tks:     tick_weighted_sum    # float, tick-weighted accumulator
      x:       confidence           # float [0,1]
      z:       SCOP                 # float, SCOP coordinate
      beta:    pressure             # float, cognitive pressure (SHI-derived)
    output: fl
    layer: 1
    source: "1765602681971.jpg"

  # ────────────────────────────────────────────────────────────────────────────
  # EXISTING FORMULAS  (from FORMULAS.md / prior system)
  # ────────────────────────────────────────────────────────────────────────────

  - id: F_SCUP_FULL
    label: SCUP Coherence (full)
    expr: "SCUP = sigma(b*P_hat + c*e + d*f + Δdrift + a*tau_bar + SHI*F_star)"
    variables:
      P_hat:    pressure_normalized
      c:        consumption
      e:        energy
      d:        decay_factor
      f:        friction
      delta_drift: semantic_drift
      a:        activation
      tau_bar:  average_latency
      SHI:      semantic_hash_index
      F_star:   forecast_smoothed
      b:        weight_pressure
    output: SCUP
    layer: 3
    source: existing

  - id: F_CORE_TRANSFORMATION
    label: Core Transformation
    expr: "k = G + H + Cc"
    variables:
      G:  global_component
      H:  height_component
      Cc: consumption_component
    output: k
    layer: X
    source: existing

  - id: F_HEIGHT
    label: Height Component
    expr: "H = |y + A| * Tcv"
    variables:
      y:   scup_coordinate
      A:   tag_set_A
      Tcv: tracer_consensus_value
    output: H
    layer: 1
    source: existing

  - id: F_GLOBAL
    label: Global Component
    expr: "G = r * j * f1"
    variables:
      r:  rhizomic_coordinate
      j:  density
      f1: SHI
    output: G
