  # VAULT KEEP NOTES — formulas from keep/2025-10-05-034506-monday-formula-sheet-sheet
  # ═══════════════════════════════════════════════════════════════════════════

  - id: F_SHANNON_EXTENSION
    label: Shannon Capacity Extension
    expr: "C = B_psi * log2(1 + unity / (drift + entropy)) + delta_semantic"
    vars:
      B_psi:         bandwidth_psi       # float, B^Ψ — bandwidth raised to capacity exponent
      unity:         unity               # float, unity scalar (typically 1.0)
      drift:         semantic_drift      # float, current semantic drift
      entropy:       entropy             # float, system entropy
      delta_semantic: semantic_delta     # float, Δ_semantic correction term
    output: C                            # channel capacity (extended Shannon)
    layer: X
    source: keep/2025-10-05-034506-monday-formula-sheet-sheet.md

  - id: F_LOAD_COEFFICIENT
    label: Load Coefficient
    expr: "Load = C_plus - C_minus"
    vars:
      C_plus:  capacity_positive   # float, positive channel capacity
      C_minus: capacity_negative   # float, negative channel capacity
    output: Load                   # net cognitive load
    layer: X
    source: keep/2025-10-05-034506-monday-formula-sheet-sheet.md

