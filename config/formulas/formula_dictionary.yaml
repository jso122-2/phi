  - id: F_COSINE_SIMILARITY
    label: Cosine Similarity
    expr: "sim(A, B) = dot(A, B) / (norm(A) * norm(B))"
    vars:
      A:    vector_a    # vector, first semantic embedding
      B:    vector_b    # vector, second semantic embedding
    output: sim         # cosine similarity ∈ [-1, 1]
    layer: X
    source: keep/2025-05-26-141815-semantic-feild-formule.md

  - id: F_EDGE_WEIGHT
    label: Semantic Edge Weight (Reinforcement)
    expr: "W_edge = sum(sim(A_i, B_i) * reinforcement(A_i, B_i) for i in range(n))"
    vars:
      A_i:          subvector_a_i      # vector, component of node A
      B_i:          subvector_b_i      # vector, component of node B
      reinforcement: reinforcement_fn  # function, nutrient-flow reinforcement between nodes
    output: W_edge                     # edge weight between nodes A and B
    layer: 1
    source: keep/2025-05-26-141815-semantic-feild-formule.md

  - id: F_PATH_COST
    label: Hybrid Path Cost (Semantic + Hop)
    expr: "Path_Cost = Hop_Count * (1 - sim(A, B))"
    vars:
      Hop_Count: hop_count     # int, number of edges traversed
      A:         node_a        # vector, source node embedding
      B:         node_b        # vector, target node embedding
    output: Path_Cost          # path traversal cost (lower = better)
    layer: 2
    source: keep/2025-05-26-141815-semantic-feild-formule.md

  - id: F_PATH_REINFORCEMENT
    label: Path Reinforcement Score
    expr: "P_reinf = sum(nutrient_flow_t for t in range(T)) / T"
    vars:
      nutrient_flow_t: nutrient_flow_at_t   # float, nutrient flowing A→B at tick t
      T:               total_ticks          # int, total ticks accumulated
    output: P_reinf                         # path reinforcement score (higher = stronger)
    layer: 1
    source: keep/2025-05-26-141815-semantic-feild-formule.md

  - id: F_PRESSURE_HEATMAP
    label: Nutrient Pressure Heatmap
    expr: "Pressure_A = sum(nutrient_flow_i * weight_i for i in connected_nodes)"
    vars:
      nutrient_flow_i: nutrient_flow_i   # float, flow from connected node i
      weight_i:        edge_weight_i     # float, weight of edge A↔i
    output: Pressure_A                   # semantic pressure at node A
    layer: X
    source: keep/2025-05-26-141815-semantic-feild-formule.md

  # ═══════════════════════════════════════════════════════════════════════════
  # VAULT KEEP NOTES — formulas from keep/2025-12-06-123319-rag-formula
  # ═══════════════════════════════════════════════════════════════════════════

  - id: F_RAG_PRIORITY
    label: RAG Semantic Priority Score
    expr: "P_sps = (X_norm / O_N) - (T_pos / P_risk)"
    vars:
      X_norm:  semantic_awareness    # float, RF output ∈ [0,1] — chunk importance
      O_N:     system_complexity     # float, O(N) — indexing overhead / load
      T_pos:   positional_context    # float, time-decay / hierarchical depth penalty
      P_risk:  perplexity_risk       # float, global constant — peripheral content tolerance
    output: P_sps                    # semantic priority score (ORDER BY, LIMIT n)
    layer: X
    note: "Pericles retrieval funnel score. Higher = higher retrieval priority."
    source: keep/2025-12-06-123319-rag-formula.md

  # ═══════════════════════════════════════════════════════════════════════════
  # PHYSICS SCAFFOLD — formulas from dawn-physics-scaffold.md
  # ═══════════════════════════════════════════════════════════════════════════

  - id: F_PLANCK_TIME
    label: Planck Time
    expr: "t_p = sqrt(hbar * G / c**5)"
    vars:
      hbar: reduced_planck_constant  # float, ℏ = 1.0546e-34 J·s
      G:    gravitational_constant   # float, G = 6.674e-11 N·m²/kg²
      c:    speed_of_light           # float, c = 2.998e8 m/s
    output: t_p                      # Planck time (hard scale lower bound)
    layer: X
    source: dawn-physics-scaffold.md

  - id: F_PLANCK_LENGTH
    label: Planck Length
    expr: "l_p = sqrt(hbar * G / c**3)"
    vars:
      hbar: reduced_planck_constant
      G:    gravitational_constant
      c:    speed_of_light
    output: l_p
    layer: X
    source: dawn-physics-scaffold.md

  - id: F_PLANCK_MASS
    label: Planck Mass
    expr: "m_p = sqrt(hbar * c / G)"
    vars:
      hbar: reduced_planck_constant
      c:    speed_of_light
      G:    gravitational_constant
    output: m_p
    layer: X
    source: dawn-physics-scaffold.md

  - id: F_PLANCK_ENERGY
    label: Planck Energy
    expr: "E_p = m_p * c**2"
    vars:
      m_p: planck_mass       # float, output of F_PLANCK_MASS
      c:   speed_of_light    # float
    output: E_p
    layer: X
    source: dawn-physics-scaffold.md

  - id: F_VOICE_EVOLUTION
    label: Voice Mutation Rate
    expr: "mu = P * (1 - SHI)"
    vars:
      P:   cognitive_pressure       # float, output of F_COGNITIVE_PRESSURE
      SHI: schema_health_index      # float ∈ [0,1], output of F_SHI_AGGREGATE or F_SHI_FULL
    output: mu                       # μ — mutation rate (voice sharpness)
    layer: X
    note: "Voice sharpens under high pressure; softens with high SHI."
    source: dawn-physics-scaffold.md

  - id: F_WOLF_REPAIR
    label: Wolf Repair Protocol (SHI recovery)
    expr: "delta_SHI_repair = k / error_count"
    vars:
      k:           repair_gain    # float, repair gain constant
      error_count: error_count    # int > 0, accumulated detected errors
    output: delta_SHI_repair       # ΔSHI — incremental SHI recovery per tick
    layer: X
    note: "Trigger: SHI < theta_safe for tau consecutive ticks. Diminishing returns by design."
    source: dawn-physics-scaffold.md

  - id: F_ENTROPY_LOOP
    label: Entropy Pulse Loop
    expr: "delta_S_tick = f(P, SHI)"
    vars:
      P:   cognitive_pressure    # float
      SHI: schema_health_index   # float
    output: delta_S_tick          # ΔS per tick — must satisfy ΔS ≥ 0
    layer: X
    note: "Second-law constraint: delta_S_tick >= 0. Pulse corrections fire when entropy would compound."
    source: dawn-physics-scaffold.md

  # ═══════════════════════════════════════════════════════════════════════════
  # MATH NODE — formulas from MATH.md / sims/ana_chi.py
  # ═══════════════════════════════════════════════════════════════════════════

  - id: F_NEG_EXP
    label: Neg-Exp Sharding Map
    expr: "neg_exp(x) = -exp(x)"
    vars:
      x: input   # float, shard input value
    output: neg_exp_x   # float, neg-exp mapped value (always ≤ 0)
    layer: 2
    note: "d/dx(−eˣ) = −eˣ — no stable fixed point in R+. Used for shard routing in CAIRRN Layer 2."
    source: MATH.md

  - id: F_DOUBLE_WELL
    label: Double-Well Potential
    expr: "V(x) = (x**2 - alpha**2)**2"
    vars:
      x:     position   # float, state coordinate
      alpha: alpha       # float, α = 1.96 — attractor basin radius
    output: V            # potential energy — minima at x = ±α
    layer: 1
    note: "V'(x) = 4x(x²-α²). Fixed points: x=0 (unstable), x=±α (stable, V''=8α²>0). α=1.96."
    source: MATH.md

  # ═══════════════════════════════════════════════════════════════════════════
  # LIVE IMPLEMENTATIONS — formulas that exist in Python but were missing
  # from the 2026-07-21 catalog. Canonised 2026-08-20.
  # ═══════════════════════════════════════════════════════════════════════════

  - id: F_CSS
    label: Coherence State Score
    expr: "CSS = A_nw · Δ · |Cc · (z_prev/z)| · |Tcv · SCOP / (e2 − H2)| · |Δ − E5| / |1 − E1|"
    variables:
      A_nw:    resources              # float, n_w weighted; proxy 1.0
      delta:   change_signal          # float, Δ since last tick
      Cc:      consumption            # float, energy cost proxy
      z_prev:  scop_z_prev            # float
      z:       scop_z                 # float, guarded ≠ 0
      Tcv:     tracer_consensus_value # float
      SCOP:    scope_coordinate       # float
      e2:      energy_math_basin      # float, proxy ≈ 3.92 (2·α)
      H2:      height_squared         # float
      e5:      energy_commands_basin  # float, proxy ≈ 11.76 (6·α)
      e1:      energy_code_basin      # float
    output: CSS
    layer: 3
    value_system: harmonic_ring
    source: workers/cairrn/formulas.py

  - id: F_M3
    label: Prefeed Quality Composite
    expr: "M3 = |CSS| · n · |FastFormula − SHI|"
    variables:
      CSS:          coherence_state_score
      n:            track_count            # int, clamped ≥ 1
      FastFormula:  mean_pfs_resonance     # float
      SHI:          schema_health_index    # float, mean shard activation
    output: M3                             # low → accept shuffle; high → discard
    layer: 3
    value_system: harmonic_ring
    source: workers/cairrn/formulas.py

  - id: F_CC
    label: Transformation Energy Budget
    expr: "Cc = ((c − A) / p) · Tcv"
    variables:
      c:   capacity_ceiling          # float, system energy ceiling
      A:   adaptive_capacity         # float, F_ADAPTIVE_CAPACITY output
      p:   pressure                  # float, guarded ≠ 0
      Tcv: tracer_consensus_value    # float [0, 1]
    output: Cc
    layer: X
    value_system: e5_gate
    source: workers/cairrn/formulas.py
    code:
      - workers.cairrn.formulas.f_cc_energy_budget
      - workers.cairrn.f_cc_energy_budget
      - phi.core.ranker.cc_budget_score

  - id: F_K_SIGIL
    label: Sigil-Layer Transformation Score
    expr: "k = (H + Cc) − G"
    variables:
      H:  height_node                # F_HEIGHT_NODE
      Cc: energy_budget              # F_CC
      G:  global_rzone               # F_GLOBAL_RZONE
    output: k                        # k > 0 viable; k < 0 blocked
    layer: X
    value_system: e5_gate
    source: workers/cairrn/formulas.py

  - id: F_E5
    label: Transformation Readiness Metric
    expr: "e5 = tanh( (H + K) / (G − energy_dot) − Bc / bc_max )"
    variables:
      H:          height_node
      K:          hub_kinetic_injection
      G:          global_rzone
      energy_dot: rhizome_scop_energy_dot   # r·En_rhizome + y·En_scop
      Bc:         queue_depth               # int
      bc_max:     queue_saturation          # int, default 20
    output: e5                              # ∈ (−1, 1)
    layer: X
    value_system: e5_gate
    source: workers/cairrn/formulas.py

  - id: F_E4
    label: Node Readiness / Locality Gate
    expr: "e4 = |e5 / (−z)| + Cc − 1"
    variables:
      e5: transformation_readiness   # F_E5 output
      z:  scop_coordinate            # spatial coherence cost, guarded ≠ 0
      Cc: energy_budget              # F_CC
    output: e4                       # e4 > 0 → track emits
    layer: Z
    value_system: e5_gate
    source: workers/cairrn/formulas.py

  - id: F_E5_LOAD_LINE
    label: Song-Stack Load Line
    expr: "V/R_min = arctanh(0.1) + Bc / bc_max"
    variables:
      Bc:     queue_depth
      bc_max: queue_saturation       # default 20
    output: VR_min                   # minimum drive-to-resistance to OPEN
    layer: X
    value_system: e5_gate
    source: workers/cairrn/formulas.py

  - id: F_ENVELOPE_MAX
    label: Routing Cost Envelope Upper Bound
    expr: "A_xmax = A^w · |z − 2c/K| · v · |i·v + 1| · βt"
    variables:
      A: resources                   # proxy 1.0
      w: resource_exponent           # proxy 1.0
      z: z_awareness
      c: consumption                 # proxy = modulated
      K: tracer_consensus_delta      # proxy 1.0, guarded ≠ 0
      v: velocity                    # |metric_raw − modulated|
      i: shard_index                 # int [0, 7]
      beta_t: pressure_at_t
    output: A_xmax                   # clip modulated to min(modulated, A_xmax)
    layer: X
    value_system: cairrn_layers
    source: workers/cairrn/formulas.py

  - id: F_ENVELOPE_MIN
    label: Routing Cost Envelope Lower Bound
    expr: "A_xmin = k · |r·g| · |z − x/βt| − βH"
    variables:
      k:      repair_gain            # proxy COHERENCE_FLOOR 0.5
      r:      rizomic_coordinate     # shard / (N−1) ∈ [0, 1]
      g:      global_friction        # proxy LOCAL_FRICTION 0.5
      z:      z_awareness
      x:      modulated
      beta_t: coherence              # guarded ≠ 0
      beta_h: height_pressure        # proxy COHERENCE_FLOOR 0.5
    output: A_xmin                   # effective floor = max(0, A_xmin)
    layer: X
    value_system: cairrn_layers
    source: workers/cairrn/formulas.py

  - id: F_COMPOSITE_HEALTH_HORIZON
    label: Composite Health Horizon
    expr: "Ti* = A / (B − 1)  if B > 1  else  ∞     A = |z+x|·|1−e|    B = N·|2+x|·|g−e|"
    variables:
      z:         z_awareness
      x:         modulated
      e:         energy              # target = 1.0
      g:         global_friction
      n_windows: tick_windows        # int N
      ti:        tick_interval       # context only
    output: Ti_star                  # max tick interval before Ψ′ goes negative
    layer: X
    value_system: cairrn_layers
    source: workers/cairrn/formulas.py

  - id: F_ENERGY_WEIGHTED_GEOM
    label: Geometric Weighted Energy
    expr: "EW_geom = Σ |x_i − z_i| · A^(2w−1) / (T_i · n_w)"
    variables:
      x_i: energy_i
      z_i: desirability_cost_i
      A:   resources
      w:   resource_philosophy       # [0, 1], default 0.5
      T_i: dist_weighted_time_i
      n_w: positive_normalisation
    output: EW_geom
    layer: 1
    value_system: cairrn_layers
    source: workers/cairrn/formulas.py

  - id: F_JULES_NORM
    label: Jules Millijoule Normalisation
    expr: "j' = J_q − min(J_q)     J_q = round(J, 3)"
    variables:
      J:   jules_raw                 # energy / entropy, any real ≥ 0
    output: j_prime                  # millijoule precision; 0.00 baseline taken out
    layer: X
    value_system: dawn_confidence
    note: >
      Jules taken to 0.001 (millijoule), then normalised with the 0.00
      floor subtracted so the most-focused reading sits at exactly 0.00.
    source: operator (2026-08-20)

  - id: F_DAWN_CONFIDENCE
    label: DAWN Confidence
    expr: "x = |k · j'| ∨ D"
    variables:
      k:       neuro_activation      # dawn neuro activation K
      j_prime: jules_normalised      # F_JULES_NORM output
      D:       drift_delta_vector    # hot-swappable drift implementation
    output: x                        # DAWN confidence — superposition cloud, not a pinpoint
    layer: X
    value_system: dawn_confidence
    note: >
      ∨ is max / logical-OR over magnitudes. D is a delta vector whose
      drift formula is hot-swappable (iwave, semantic, embedding, mycelial).
      Nested into Pericles as the denominator, and into the r1–r6 stack as x_i.
      Imaginary / superposition value — the cloud of where DAWN could be,
      not the measured confidence.
    source: operator (2026-08-20); keep/2026-03-24-234438

  - id: F_PERICLES
    label: Pericles Exact-Retrieval Score
    expr: "per = |tc_A − Adp_At| · k / x     x = F_DAWN_CONFIDENCE"
    variables:
      tc_A:    tag_coherence_A
      Adp_At:  adaptive_attractor
      k:       combined_score
      x:       dawn_confidence       # F_DAWN_CONFIDENCE
    output: per
    layer: X
    value_system: pericles
    source: psspps/find.py

  - id: F_HARMONIC_PROPAGATE
    label: Local Harmonic Diffusion
    expr: "a_i(t+1) = a_i(t) + κ · [a_{i−1}(t) + a_{i+1}(t) − 2·a_i(t)]"
    variables:
      a_i:   shard_activation
      kappa: coupling                # default 0.15, domain (0, 0.5)
    output: a_i_next
    layer: 2
    value_system: harmonic_ring
    source: sims/harmonic.py

  - id: F_RESONANCE_PROPAGATE
    label: Resonance-Sharing Propagator
    expr: "w_i = exp( (−cos(π · a_p/A)) · (−cos(π · d_i)) )     hotspot donates κ·a_p"
    variables:
      a_p:   peak_activation
      A:     total_activation
      d_i:   ring_distance           # min(|i−p|, N−|i−p|) / (N/2) ∈ [0, 1]
      kappa: coupling                # default 0.15, domain (0, 1)
    output: a_redistributed          # total activation conserved
    layer: 2
    value_system: harmonic_ring
    source: sims/harmonic.py

  - id: F_GRADIENT_DESCENT
    label: Double-Well Gradient Descent
    expr: "x_{n+1} = x_n − lr · V′(x_n)     V′(x) = 4x(x² − α²)"
    variables:
      x:     position
      lr:    learning_rate           # default 0.05
      alpha: alpha                   # 1.96
    output: x_next                   # converges to +α if x0>0, −α if x0<0
    layer: 1
    value_system: double_well
    source: sims/attractors.py

  - id: F_LANGEVIN
    label: Overdamped Langevin Update
    expr: "x_{n+1} = x_n − lr · V′(x_n) + √(2·D·lr) · ξ     ξ ~ N(0,1)"
    variables:
      x:           position
      lr:          learning_rate
      D:           diffusion         # noise_scale²
      noise_scale: sigma
    output: x_next
    layer: 1
    value_system: double_well
    source: mfpt.md

  - id: F_KRAMERS
    label: Overdamped Kramers Escape Rate
    expr: "λ = (ω₀ · ω_s) / 2π · exp(−ΔV / D)"
    variables:
      omega_0: well_frequency        # 2√2·α = 5.5436
      omega_s: saddle_frequency      # 2α = 3.92
      delta_V: barrier_height        # α⁴ = 14.7579
      D:       diffusion             # noise_scale²
    output: lambda_escape
    layer: 1
    value_system: double_well
    source: mfpt.md

  - id: F_MFPT
    label: Mean First Passage Time
    expr: "τ = 1/λ     τ_steps = τ / lr"
    variables:
      lambda_escape: kramers_rate
      lr:            learning_rate
    output: tau
    layer: 1
    value_system: double_well
    source: mfpt.md

  - id: F_LAMBERT_W
    label: Lambert-W Fixed Point of −eˣ
    expr: "x* = −W(1)     −e^{x*} = x*"
    variables:
      W_1: lambert_w_of_1            # 0.5671432904097838
    output: x_star                   # −0.5671432904097838
    layer: 2
    value_system: physics
    source: lambert-w.md

  - id: F_MYCELIAL_DEMAND
    label: Mycelial Node Demand
    expr: "D_i = wP·P_i + wΔ·drift_align_i + wR·recency_i − wσ·σ_i"
    variables:
      P_i:          pressure
      drift_align:  drift_alignment  # [−1, 1]
      recency:      recency          # [0, 1]
      entropy:      sigma_i
      wP:           w_pressure       # 0.40
      wDelta:       w_drift          # 0.25
      wR:           w_recency        # 0.20
      wSigma:       w_entropy        # 0.15
    output: D_i
    layer: 1
    value_system: mycelial
    source: workers/cairrn/mycelial.py

  - id: F_CONDUCTANCE
    label: Mycelial Edge Conductance
    expr: "g_ij = σ(κ · w_ij)     σ = 1 / (1 + e^{−x})"
    variables:
      w_ij:  edge_weight
      kappa: coupling                # 0.15
    output: g_ij                     # ∈ (0, 1)
    layer: 1
    value_system: mycelial
    source: workers/cairrn/mycelial.py

  - id: F_METABOLISE
    label: Nutrient-to-Energy Conversion
    expr: "E = clamp(η · nutrients − basal_cost, 0, E_max)"
    variables:
      nutrients:  allocated_nutrients
      eta:        conversion_rate    # 0.80
      basal_cost: basal_cost         # 0.02
      E_max:      energy_ceiling     # 1.00
    output: E
    layer: 1
    value_system: mycelial
    source: workers/cairrn/mycelial.py
